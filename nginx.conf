# Example only: replace server_name and add HTTPS before a public launch.
# Keep the Next.js server running on 127.0.0.1:3000.
server {
    listen 80;
    server_name localhost;
    client_max_body_size 6m; # Application limit: a 5 MiB passport image plus form data.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
